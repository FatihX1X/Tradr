name: Tests
on:
  push:
    branches: [main, codex/tradr-hedge-bot]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
      - run: python -m compileall -q src
      - run: python -m pip check
