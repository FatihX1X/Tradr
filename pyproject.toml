[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tradr-hedge"
version = "0.1.0"
description = "Fail-closed cross-venue hedge execution for Arcus and Lighter RH"
requires-python = ">=3.12,<3.14"
dependencies = ["aiohttp>=3.10,<4", "cryptography>=43,<47", "lighter-sdk==1.1.6", "filelock>=3.16,<4", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[project.scripts]
tradr = "tradr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
